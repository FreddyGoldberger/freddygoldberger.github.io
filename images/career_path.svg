<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 988" width="2400" height="988" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Career path of Freddy Goldberger</title>
  <desc id="d">A circuit-board trace connecting five milestones: 2003 Valparaíso, Chile, electronic engineering; 2010 Calama, Chile, autonomous haulage support; 2011 Tucson, Arizona, Komatsu FrontRunner autonomous haulage; 2024 McLean, Virginia, cooperative driving automation at Leidos; 2026 McLean, Virginia, Capital One.</desc>
  <defs>
