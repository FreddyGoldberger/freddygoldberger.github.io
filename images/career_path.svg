      <stop offset="0" stop-color="#1b1b2f"/>
      <stop offset="0.6" stop-color="#22223B"/>
      <stop offset="1" stop-color="#3a3a5a"/>
    </linearGradient>
    <linearGradient id="bus" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="2310" y2="0">
      <stop offset="0" stop-color="#9A8C98"/>
      <stop offset="1" stop-color="#b57e71"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b57e71" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b57e71" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="2400" height="988" fill="url(#bg)"/>
